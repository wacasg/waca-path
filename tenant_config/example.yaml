# The minimal public backend reads only gcp.project_id and gcp.bq_dataset.
# Other keys below are descriptive or reserved for future use and are not read
# by this backend yet.
tenant_id: example
tenant_name: "Example Organization"   # descriptive only; not read by the backend

gcp:
  project_id: "your-gcp-project-id"
  bq_dataset: "waca_core_output"
  region: "asia-northeast1"           # not read by the backend; scripts use WACA_PATH_LOCATION

# Reserved for future use. The minimal backend does not read the `site` block.
site:
  base_url: "https://www.example.com"
  key_paths:
    - "/"
    - "/pricing"
    - "/checkout/thank-you"

# Admin UI settings (v0.2.0). All optional.
ui:
  # Language shown when the visitor has no ?lang= and no cookie and their
  # Accept-Language header matches nothing. Supported: ja, en.
  default_lang: "en"

  # GA4 custom dimensions to show as extra columns in the users list, the user
  # detail page and the CSV export. WACA path ships none by default: declare the
  # ones your own micro_user_table actually has.
  # A column that does not exist in the table is skipped rather than breaking
  # the page, so a stale entry here is safe.
  custom_columns:
    - column: membership_type      # column name in micro_user_table
      label: "Membership"          # heading shown in the UI and the CSV
